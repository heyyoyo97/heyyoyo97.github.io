<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Dropshippers following Shopee Shop</title>
  <desc id="desc">Thirty-seven percent of surveyed dropshippers followed Shopee Shop and sixty-three percent did not.</desc>
  <rect width="1600" height="1000" fill="#f7f7f3"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#17191c">
    <text x="96" y="118" font-size="46" font-weight="500" letter-spacing="-1.2">Most surveyed dropshippers did not follow Shop</text>
    <text x="96" y="166" font-size="20" fill="#666a70">Feature awareness was not reaching the majority of the intended audience</text>

    <text x="96" y="438" font-size="166" font-weight="500" fill="#d85f36" letter-spacing="-5">37%</text>
    <text x="430" y="374" font-size="28" font-weight="600">followed Shopee Shop</text>
    <text x="430" y="416" font-size="20" fill="#666a70">Less than two in five surveyed dropshippers</text>

    <rect x="96" y="548" width="1408" height="112" fill="#f4e7c9"/>
    <rect x="96" y="548" width="521" height="112" fill="#d85f36"/>
    <line x1="617" y1="530" x2="617" y2="682" stroke="#17191c" stroke-width="2"/>

    <text x="96" y="726" font-size="18" fill="#b94725" letter-spacing="1.6">FOLLOW SHOP</text>
    <text x="96" y="772" font-size="42" font-weight="600">37%</text>
    <text x="1504" y="726" font-size="18" text-anchor="end" fill="#666a70" letter-spacing="1.6">DO NOT FOLLOW</text>
    <text x="1504" y="772" font-size="42" font-weight="600" text-anchor="end">63%</text>

    <line x1="96" y1="858" x2="1504" y2="858" stroke="#b9bdc1"/>
    <text x="96" y="912" font-size="21" fill="#666a70">Design implication</text>
    <text x="330" y="912" font-size="24">Introduce the dropshipper value and entry point inside the product journey.</text>
  </g>
</svg>
