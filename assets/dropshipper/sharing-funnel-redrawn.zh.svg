<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Shopee Dropshipper 分享漏斗</title>
  <desc id="desc">四个阶段依次显示 150 万白名单用户、51 万目录访客、4.5 万添加商品用户和 2.45 万分享商品用户，最大流失发生在添加商品之前。</desc>
  <rect width="1600" height="760" fill="#f7f7f3"/>
  <g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" fill="#17191c">
    <text x="96" y="104" font-size="48" font-weight="500" letter-spacing="-1.5">分享漏斗在哪里断裂</text>
    <text x="96" y="150" font-size="20" fill="#666a70">符合条件的代理商从进入功能到分享商品的转化</text>

    <g transform="translate(96 246)">
      <rect width="280" height="250" fill="#fdfdfb" stroke="#aeb2b7"/>
      <text x="28" y="42" font-size="15" fill="#d85f36" letter-spacing="2">符合资格</text>
      <text x="28" y="120" font-size="54" font-weight="600">1.5M</text>
      <text x="28" y="170" font-size="24">白名单用户</text>
      <text x="28" y="211" font-size="17" fill="#666a70">起始用户</text>
    </g>

    <g transform="translate(472 246)">
      <rect width="280" height="250" fill="#f4e7c9" stroke="#d3c973"/>
      <text x="28" y="42" font-size="15" fill="#b94725" letter-spacing="2">进入目录</text>
      <text x="28" y="120" font-size="54" font-weight="600">510K</text>
      <text x="28" y="170" font-size="24">My Catalogue</text>
      <text x="28" y="211" font-size="17" fill="#4c5560">符合资格用户的 34.0%</text>
    </g>

    <g transform="translate(848 246)">
      <rect width="280" height="250" fill="#d85f36"/>
      <text x="28" y="42" font-size="15" fill="#fdfdfb" letter-spacing="2">添加商品</text>
      <text x="28" y="120" font-size="54" font-weight="600" fill="#ffffff">45K</text>
      <text x="28" y="170" font-size="24" fill="#ffffff">已添加商品</text>
      <text x="28" y="211" font-size="17" fill="#f4e7c9">目录访客的 8.8%</text>
    </g>

    <g transform="translate(1224 246)">
      <rect width="280" height="250" fill="#17191c"/>
      <text x="28" y="42" font-size="15" fill="#d3c973" letter-spacing="2">完成分享</text>
      <text x="28" y="120" font-size="54" font-weight="600" fill="#ffffff">24.5K</text>
      <text x="28" y="170" font-size="24" fill="#ffffff">已分享商品</text>
      <text x="28" y="211" font-size="17" fill="#cfd1d4">添加用户的 54.4%</text>
    </g>

    <g fill="none" stroke="#d85f36" stroke-width="2">
      <path d="M392 371H448"/>
      <path d="m438 361 10 10-10 10"/>
      <path d="M768 371H824"/>
      <path d="m814 361 10 10-10 10"/>
      <path d="M1144 371H1200"/>
      <path d="m1190 361 10 10-10 10"/>
    </g>

    <text x="420" y="344" font-size="18" text-anchor="middle" fill="#d85f36">34.0%</text>
    <text x="796" y="344" font-size="18" font-weight="600" text-anchor="middle" fill="#b94725">8.8%</text>
    <text x="1172" y="344" font-size="18" text-anchor="middle" fill="#d85f36">54.4%</text>

    <path d="M988 522v52H848" fill="none" stroke="#d85f36" stroke-width="2"/>
    <circle cx="988" cy="522" r="5" fill="#d85f36"/>
    <text x="848" y="618" font-size="28" font-weight="600">添加商品是最关键的流失点。</text>
    <text x="848" y="654" font-size="19" fill="#666a70">51 万目录访客中只有 4.5 万人到达这一步。</text>
  </g>
</svg>
